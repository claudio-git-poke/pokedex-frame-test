<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07120e" />
  <title>Pokédex Frame Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="device" aria-label="Demo cornice Pokédex responsive">
    <section class="display-shell">
      <div class="stage-viewport" id="stageViewport">
        <div class="virtual-stage" id="virtualStage">
          <header class="screen-header">
            <div>
              <p class="eyebrow">FRAME PROTOTYPE</p>
              <h1>Area widget</h1>
            </div>
            <span class="status"><i></i> ONLINE</span>
          </header>
          <div class="widget-grid" aria-label="Griglia di widget dimostrativi">
            <article class="widget widget--large"><span>1×1</span><strong>Widget principale</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 02</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 03</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 04</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 05</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 06</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 07</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 08</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 09</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 10</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 11</strong></article>
            <article class="widget"><span>1×1</span><strong>Modulo 12</strong></article>
          </div>
          <footer class="screen-footer" id="diagnostics" aria-live="polite"></footer>
        </div>
      </div>
    </section>
    <div class="pokeball pokeball--top" aria-hidden="true"><span></span></div>
    <div class="pokeball pokeball--bottom" aria-hidden="true"><span></span></div>
    <div class="pokeball pokeball--left" aria-hidden="true"><span></span></div>
    <div class="pokeball pokeball--right" aria-hidden="true"><span></span></div>
    <div class="leds leds--left" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="leds leds--right" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
